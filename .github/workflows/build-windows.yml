name: Build Windows installer

on:
  push:
    branches: [arena/62202821-sidawplayer]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo --version

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Copy demo audio
        shell: pwsh
        run: .\rust\scripts\copy-assets.ps1

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "$env:GITHUB_WORKSPACE\rust\installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SiDaWPlayer-windows-setup
          path: rust/installer/Output/SiDaWPlayer-setup.exe
          retention-days: 30

      - name: Publish installer as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-rust
          name: SiDaW Player 0.2.0 — Rust edition (Windows)
          body: |
            Установщик Windows для нативной Rust-версии плеера (`rust/`).

            Скачай `SiDaWPlayer-setup.exe`, запусти его и следуй инструкциям мастера. Демо-треки включаются в установку.

            Первый этап порта: локальная медиатека, воспроизведение, 10-полосный эквалайзер, избранное, поиск, сохранение состояния. Исходники и инструкция — в `rust/README.md`.
          files: rust/installer/Output/SiDaWPlayer-setup.exe
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
