name: Build Windows installer

on:
  push:
    branches: [arena/62202821-sidawplayer]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo --version

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Copy demo audio
        shell: pwsh
        run: .\rust\scripts\copy-assets.ps1

      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --release --manifest-path rust/Cargo.toml 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Where-Object { $_ -match '^error|^ *-->|^help:|^note:|^ *=|^ *\|' } | ForEach-Object {
              $line = $_.Replace('%', '%25').Replace("`r", '').Replace("`n", ' ')
              "::error::$line"
            }
            exit 1
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "$env:GITHUB_WORKSPACE\rust\installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SiDaWPlayer-windows-setup
          path: rust/installer/Output/SiDaWPlayer-setup.exe
          retention-days: 30

      - name: Publish installer as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-rust
          name: SiDaW Player 0.5.0 — Rust edition (Windows)
          body: |
            Установщик Windows для нативной Rust-версии плеера (`rust/`).

            Скачай `SiDaWPlayer-setup.exe`, запусти его и следуй инструкциям мастера. Демо-треки включаются в установку.

            Новое в 0.5.0: исправлено отображение интерфейса — фон рисуется под виджетами, свечение стало мягким; анимированная неоновая «волна» (живой фон, пульсация активного трека, плавная смена акцента); «Моя волна» (бесконечный микс с учётом избранного и истории), гибкое оформление (5 тем, акцентный RGB, светлый режим, масштаб), открытый каталог Openverse с треками под свободными лицензиями и атрибуцией. Сохранены локальная медиатека, эквалайзер и поиск. Исходники и инструкция — в `rust/README.md`.
          files: rust/installer/Output/SiDaWPlayer-setup.exe
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
